<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 70" width="340" height="70">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C158"/>
      <stop offset="50%" stop-color="#C69224"/>
      <stop offset="100%" stop-color="#8C5C0F"/>
    </linearGradient>
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCEBA6"/>
      <stop offset="100%" stop-color="#C9982A"/>
    </linearGradient>
  </defs>

  <!-- Stylized Geometric Axumite / Triangular 'A' Monogram -->
  <g transform="translate(10, 8)">
    <!-- Outer Triangle Frame -->
    <path d="M 28 3 L 53 51 L 3 51 Z" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-linejoin="round"/>
    <!-- Inner Crossbar & Stepped Monolith Apex -->
    <path d="M 28 15 L 42 42 L 14 42 Z" fill="url(#goldLight)" opacity="0.3"/>
    <path d="M 17 38 L 39 38" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
    <circle cx="28" cy="27" r="3.5" fill="url(#goldGrad)"/>
    <!-- Stepped base accents (symbolic of Axum stelae) -->
    <rect x="0" y="52" width="56" height="3" rx="1.5" fill="url(#goldGrad)"/>
  </g>

  <!-- Typography -->
  <text x="76" y="32" font-family="'Cinzel', 'Trajan Pro', 'Georgia', 'Playfair Display', serif" font-size="22" font-weight="800" letter-spacing="2.2" fill="#FFFFFF">ABYSSINIAN</text>
  <text x="77" y="49" font-family="'Inter', 'Montserrat', 'Helvetica Neue', sans-serif" font-size="11.5" font-weight="600" letter-spacing="4.8" fill="#D4AF37">TOUR OPERATOR</text>
  <text x="78" y="61" font-family="'Inter', 'Helvetica Neue', sans-serif" font-size="7" font-weight="500" letter-spacing="1.1" fill="#A89E91">DIRECT INBOUND DMC • ADDIS ABABA</text>
</svg>

